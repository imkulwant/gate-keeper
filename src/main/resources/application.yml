logging:
  level:
    io.micrometer.tracing: DEBUG
    io.opentelemetry.exporter.zipkin: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
  file:
    name: ./logs/api-gateway.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,liveness,readiness
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState.enabled: true
    readinessState.enabled: true
  info.build.enabled: true
  tracing:
    enabled: true
    sampling.probability: 1.0 # Sample all requests

resilience4j:
  circuit-breaker:
    instances:
      defaultCircuitBreaker:
        sliding-window-size: 5 # No of recent calls are tracked to check for failures
        minimum-number-of-calls: 3 # least number of calls needed before the circuit breaker starts checking for failures
        failure-rate-threshold: 50 # percentage of failed calls that will cause the circuit breaker to open
        wait-duration-in-open-state: 10000 # Duration in milliseconds for how long the circuit breaker stays open before trying to allow calls again

spring:
  application.name: gate-keeper
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            max-header-size: 128KB
          metrics:
            enabled: true
          routes:
            - id: service1
              uri: http://localhost:8081
              predicates:
                - Path=/service1/**
              filters:
                - RewritePath=/service1(?<remaining>/?.*), $\{remaining}
                - name: CircuitBreaker
                  args:
                    name: defaultCircuitBreaker
                    fallbackUri: forward:/fallback
            - id: service2
              uri: http://localhost:8082
              predicates:
                - Path=/service2/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 2
                    key-resolver: "#{@IPAddressKeyResolver}"
                - RewritePath=/service2(?<remaining>/?.*), $\{remaining}
    httpclient:
      wiretap: true
    httpserver:
      wiretap: true
  reactor:
    context-propagation: auto
  data:
    redis:
      host: localhost
      port: 6379
  tracing:
    enabled: true
  zipkin:
    tracing:
      enabled: true
      endpoint: http://localhost:9411/api/v2/spans
      # You can enable B3 propagation explicitly to help Zipkin's UI
      b3-propagation:
        enabled: true

spring-doc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
